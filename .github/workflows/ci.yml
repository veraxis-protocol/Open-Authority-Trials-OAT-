name: ci

# Open Authority Trials — METHOD_DEVELOPMENT_ONLY. Claim-bearing use PROHIBITED.
# A green run here means the instrument reproduces its own synthetic reference
# boundary. It certifies nothing about any external system.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: local gate (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Run the full gate
        run: make ci

      - name: Confirm the working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: the gate modified tracked files"
            git status --porcelain
            exit 1
          fi
